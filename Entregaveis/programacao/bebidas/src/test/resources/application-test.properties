# Perfil de teste: usa H2 em memória, não requer MySQL
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 console para debug (opcional)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Desabilita init SQL do schema/seed para testes
spring.sql.init.mode=never

# JWT para testes
app.jwt.secret=c2VjcmV0LXRlc3Qtc2VjcmV0LXRlc3Qtc2VjcmV0LXRlc3Qtc2VjcmV0LXRlc3Q=
app.jwt.expiration=3600000

# Timezone para testes
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo
spring.jackson.time-zone=America/Sao_Paulo
