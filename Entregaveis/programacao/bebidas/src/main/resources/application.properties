spring.application.name=bebidas
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/bebidas_db?createDatabaseIfNotExist=true&connectionTimeZone=America/Sao_Paulo
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.sql.init.schema-locations=
spring.sql.init.data-locations=file:../../banco/seed.sql
spring.sql.init.mode=always

# Chave JWT: NUNCA versionar. A aplicacao le a variavel de ambiente APP_JWT_SECRET,
# que deve conter uma chave em Base64 de no minimo 32 bytes. Para gerar:
#   openssl rand -base64 48
# PowerShell: [Convert]::ToBase64String((1..48 | % { Get-Random -Max 256 }))
app.jwt.secret=${APP_JWT_SECRET:}
app.jwt.expiration=3600000

# Configuração de timezone para OffsetDateTime
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo
spring.jackson.time-zone=America/Sao_Paulo
