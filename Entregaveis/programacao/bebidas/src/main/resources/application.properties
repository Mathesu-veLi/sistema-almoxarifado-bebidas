spring.application.name=bebidas
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/bebidas_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# nao cria tabelas automaticamente pois o schema vem do schema.sql
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect


# 1) schema.sql executado manualmente no XAMpp/MySQL Workbench (tem DELIMITER,
#    que o Spring/JDBC nao entende).
# 2) seed.sql e puro INSERT, entao o Spring roda automaticamente na inicializacao.
spring.sql.init.schema-locations=
spring.sql.init.data-locations=file:../../banco/seed.sql
spring.sql.init.mode=always

app.jwt.secret=${APP_JWT_SECRET:}
app.jwt.expiration=3600000
